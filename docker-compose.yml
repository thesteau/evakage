services:
  drop-pak:
    build: .
    container_name: drop-pak
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # Local-network WebRTC usually needs no STUN/TURN.
      # For routed/VPN/remote networks, supply valid RTCIceServer objects, e.g.:
      # ICE_SERVERS_JSON: '[{"urls":"turn:turn.example.com:3478","username":"user","credential":"secret"}]'
      MAX_FILE_BYTES: "536870912"
