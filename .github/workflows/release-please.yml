name: "Release: Plan and publish"

on:
  push:
    branches: [prod]
  pull_request_target:
    branches: [release-state]
    types: [closed]
  workflow_dispatch:
    inputs:
      operation:
        description: Plan a release, or retry publishing approved release-state
        type: choice
        options: [plan, publish]
        default: plan

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-state
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'prod')) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'release-please--branches--release-state')
    runs-on: ubuntu-latest
    steps:
      # Never execute code from the metadata branch or a PR head.
      - uses: actions/checkout@v7
        with:
          ref: prod
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - name: Plan or publish the recorded production commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: ${{ github.event_name == 'pull_request_target' && 'publish' || inputs.operation || 'plan' }}
          RELEASE_STATE_REF: ${{ github.event.pull_request.merge_commit_sha || 'release-state' }}
        run: node scripts/release-state.cts
      # GITHUB_TOKEN does not trigger pull_request_target or release workflows.
      # Explicit dispatches do trigger them, using the trusted prod workflows.
      - name: Start stable image publishing
        if: github.event_name == 'pull_request_target' || inputs.operation == 'publish'
        uses: actions/github-script@v9
        env:
          RELEASE_STATE_REF: ${{ github.event.pull_request.merge_commit_sha || 'release-state' }}
        with:
          script: |
            const repo = context.repo;
            const {data} = await github.rest.repos.getContent({
              ...repo, path: 'release.json', ref: process.env.RELEASE_STATE_REF
            });
            const state = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            await github.rest.actions.createWorkflowDispatch({
              ...repo, workflow_id: 'stable-docker-images.yml', ref: 'prod',
              inputs: {tag: state.tag}
            });
      # Catch up with prod only after the published release's build is started.
      - name: Plan next release after publication
        if: github.event_name == 'pull_request_target' || inputs.operation == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OPERATION: plan
        run: node scripts/release-state.cts
      - name: Start metadata validation
        uses: actions/github-script@v9
        with:
          script: |
            const repo = context.repo;
            const {data: prs} = await github.rest.pulls.list({
              ...repo, state: 'open', base: 'release-state',
              head: `${repo.owner}:release-please--branches--release-state`
            });
            for (const pr of prs) {
              await github.rest.actions.createWorkflowDispatch({
                ...repo, workflow_id: 'release-state-check.yml', ref: 'prod',
                inputs: {pr: String(pr.number)}
              });
            }
