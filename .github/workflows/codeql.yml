name: CodeQL

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:
  schedule:
    # Catch newly published advisories against code that has not changed.
    - cron: '27 5 * * 1'

permissions:
  contents: read
  security-events: write
  # The analyze step reads its own workflow run to attach results; without this
  # it fails with "Resource not accessible by integration".
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Build modes are per language: JavaScript/TypeScript is extracted from
    # source and rejects any other mode, while Go is traced through a real build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: '**/go.sum'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          # The tests deliberately build URLs from fixture data and write to the
          # OS temp dir; they are never shipped, so their findings are noise.
          config: |
            paths-ignore:
              - tests/unit
              - tests/release
              - tests/go

      # Only the shipped server module; tests/go is a separate test-only module.
      - name: Build the Go server
        if: matrix.build-mode == 'manual'
        working-directory: app
        run: go build ./...

      # Uploading to the Security tab needs code scanning enabled, which a private
      # repository only has with GitHub Code Security. Until then, results are
      # kept as a build artifact and gated here instead. Set the repository
      # variable CODE_SCANNING_ENABLED=true to upload once it is available.
      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: ignore

      # Fail on any finding from a security query; quality findings are listed
      # but do not fail the build.
      - name: Gate on security findings
        run: |
          set -euo pipefail
          report() {
            jq -r --arg want "$1" '
              .runs[]
              | ([.tool.driver.rules[]?, .tool.extensions[]?.rules[]?] | map({(.id): .}) | add // {}) as $rules
              | .results[]
              | (($rules[.ruleId].properties.tags // []) | index("security") != null) as $sec
              | select(($want == "security") == $sec)
              | "\(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  \(.message.text)"
            ' sarif-results/*.sarif
          }
          quality=$(report quality)
          security=$(report security)
          if [ -n "$quality" ]; then
            echo "::group::Quality findings (not blocking)"
            echo "$quality"
            echo "::endgroup::"
          fi
          if [ -n "$security" ]; then
            echo "$security" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "No security findings."
