name: "CI: Validate app"

on:
  push:
    # Main pushes are validated by image-latest.yml before it publishes.
    branches: [prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or release tag to validate
        type: string
        required: false

permissions:
  contents: read

# Called main/stable runs and prod pushes stay independent; cancel obsolete PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Check source and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: '**/go.sum'
          cache: true
      - run: npm --prefix app run check
      - run: go -C tests/go test -race -tags testbridge ./...
      - run: npm --prefix app audit --audit-level=high

  browser:
    name: Check browser behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: '**/go.sum'
          cache: true
      - run: npm --prefix app exec -- playwright install --with-deps chromium firefox webkit
      - run: npm --prefix app run test:e2e
      - run: npm --prefix app run test:e2e:platform -- --output=test-results/platform
      - name: Preserve browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-traces
          path: app/test-results/
          retention-days: 7

  container:
    name: Validate container
    runs-on: ubuntu-latest
    needs: [test, browser]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - name: Build scan candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          load: true
          tags: evakage:scan
          cache-from: type=gha,scope=validation
          cache-to: type=gha,mode=max,scope=validation
      - name: Smoke-test the image
        shell: bash
        run: |
          docker run -d --name smoke -p 3000:3000 evakage:scan
          trap 'docker rm -f smoke >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            echo "Health check attempt $attempt"
            if curl -fsS http://127.0.0.1:3000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: evakage:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
