name: "Image: Main latest"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep validation and publishing in one run. A promotion PR from main to prod
  # still gets app CI, but its completion cannot trigger another image run.
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Serialize only publishing, so validation for newer pushes can run ahead.
    concurrency:
      group: image-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check main revision
        id: current
        uses: actions/github-script@v9
        with:
          script: |
            const {data} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            core.setOutput('publish', data.object.sha === context.sha ? 'true' : 'false');
      - uses: docker/setup-qemu-action@v4
        if: steps.current.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.current.outputs.publish == 'true'
      - name: Set image name
        if: steps.current.outputs.publish == 'true'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/evakage" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.current.outputs.publish == 'true'
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: |
            VERSION=dev
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main
