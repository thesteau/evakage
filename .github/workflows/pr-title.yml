name: "PR: Conventional Commit title"

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Validate Conventional Commit PR title
    runs-on: ubuntu-latest
    steps:
      # Squash merges use the PR title as the commit Release Please reads on prod.
      - uses: actions/github-script@v9
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const title = process.env.PR_TITLE.trim();
            const releasing = {feat: 'minor', fix: 'patch', perf: 'patch', revert: 'patch'};
            const quiet = ['docs', 'chore', 'refactor', 'test', 'build', 'ci', 'style', 'deps'];
            const match = /^([a-z]+)(\([a-z0-9._/-]+\))?(!)?: \S/.exec(title);
            const bump = match && Object.hasOwn(releasing, match[1]) ? releasing[match[1]] : null;
            if (!match || !(bump || quiet.includes(match[1]))) {
              core.setFailed(`PR title "${title}" is not a Conventional Commit title. Use "<type>[(scope)][!]: <summary>" ` +
                `where type is one of: ${[...Object.keys(releasing), ...quiet].join(', ')}. ` +
                'See docs/releases.mdx#pr-titles.');
              return;
            }
            const effect = match[3] ? 'major release' :
              bump ? `${bump} release` : 'no release on its own';
            core.notice(`"${match[1]}${match[3] ?? ''}" title: ${effect} once promoted to prod.`);
