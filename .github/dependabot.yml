version: 2

updates:
  # The app itself has no runtime dependencies, but keep the lockfile and any
  # future dev tooling current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Picks up new node:22-alpine base images, which is where container CVEs
  # usually arrive for this project.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
